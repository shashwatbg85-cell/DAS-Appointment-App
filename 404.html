<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Online Doctor Appointment</title>
    <script>
      // Single Page App GitHub Pages redirect trick
      // Encodes the full path/query/hash into a single query parameter
      // and redirects to the root index.html, which will decode and restore it.
      var segmentCount = 1; // number of path segments in the repo name (1 for /DAS-Appointment)

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.split('/').slice(1 + segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting&hellip;
  </body>
</html>
